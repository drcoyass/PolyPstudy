name: Daily Paper Sync

on:
  schedule:
    # 毎日UTCの18:00（日本時間の午前3:00）に実行
    - cron: '0 18 * * *'
  workflow_dispatch: # 手動実行用ボタンも有効化

jobs:
  sync_papers:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Sync Script
      run: python sync_all_research.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/latest_papers.json
        # 差分がある場合のみコミットしてプッシュ
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync daily papers via GitHub Actions" && git push)
